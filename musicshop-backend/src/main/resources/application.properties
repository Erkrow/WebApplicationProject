spring.application.name=guitarshop-backend

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JWT Configuration — staly klucz zapobiega wygasaniu tokenow po restarcie serwera
# WAZNE: W produkcji zastap wartoscia ze zmiennej srodowiskowej: ${JWT_SECRET}
app.jwt.secret=GuitarShop2026SecretKeyForJWTSigningMustBeAtLeast256BitsLongAndSecure
app.jwt.expiration=86400000

